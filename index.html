<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahorra+</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5f6b7a;--bd:#dde2e8;--pri:#0f766e;--ptx:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--okbg:#dcfce7;--warnbg:#fef3c7;--badbg:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--card:#1a2127;--tx:#eef1f4;--mut:#9aa7b4;--bd:#2d3741;--pri:#2dd4bf;--ptx:#06201c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--okbg:#14351f;--warnbg:#3a2c0b;--badbg:#3f1616}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:460px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
.big{font-size:44px;font-weight:700;margin:4px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
label{display:block;font-size:14px;margin:12px 0 4px}
input[type=number],input[type=text],input[type=time]{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px}
button.p{background:var(--pri);color:var(--ptx);border-color:var(--pri);font-weight:600;width:100%;margin-top:12px}
button.s{width:100%;margin-top:8px}
button.l{border:0;background:none;color:var(--mut);padding:6px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:15px}
.hide{display:none}
.err{color:var(--bad);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<main>

<section id="v-cfg" class="hide">
  <div class="top"><h1>Ahorra+</h1></div>
  <div class="card">
    <h2>Configuración</h2>
    <p class="mut">Se hace una sola vez. Puedes corregirla durante el mes.</p>
    <label for="c-ing">Ingreso del mes (S/)</label>
    <input id="c-ing" type="number" inputmode="decimal" min="0" step="0.01">
    <label for="c-fij">Gastos fijos del mes (S/)</label>
    <input id="c-fij" type="number" inputmode="decimal" min="0" step="0.01">
    <label for="c-met">Meta de ahorro del mes (S/)</label>
    <input id="c-met" type="number" inputmode="decimal" min="0" step="0.01">
    <div class="chk"><input id="c-rem" type="checkbox"><label for="c-rem" style="margin:0">Recordatorio diario para anotar mis gastos</label></div>
    <label for="c-hora">Hora del recordatorio</label>
    <input id="c-hora" type="time" value="20:00">
    <p class="mut">El aviso aparece dentro de la app y, si das permiso, como notificación mientras la página esté abierta.</p>
    <div id="c-err" class="err"></div>
    <button id="c-save" class="p">Guardar</button>
    <button id="c-cancel" class="s hide">Cancelar</button>
    <button id="c-reset" class="l hide">Borrar todos mis datos</button>
  </div>
</section>

<section id="v-home" class="hide">
  <div class="top"><h1>Ahorra+</h1><button id="h-cfg" class="l">Ajustes</button></div>
  <div id="h-banner" class="banner hide"></div>
  <div class="card">
    <div class="mut">Disponible hoy</div>
    <div id="h-disp" class="big">S/ 0.00</div>
    <div class="bar" id="h-bar"><i></i></div>
    <div id="h-msg" class="mut"></div>
    <button id="h-add" class="p">Registrar gasto</button>
    <button id="h-nada" class="s">Hoy no gasté nada</button>
  </div>
  <div class="card">
    <h2>Gastos de hoy</h2>
    <div id="h-list"></div>
  </div>
  <div class="card">
    <h2>Resumen del mes</h2>
    <div class="bar"><i id="h-mbar"></i></div>
    <div id="h-mes" class="mut"></div>
  </div>
</section>

<section id="v-add" class="hide">
  <div class="top"><h1>Registrar gasto</h1></div>
  <div class="card">
    <label for="a-monto">Monto (S/)</label>
    <input id="a-monto" type="number" inputmode="decimal" min="0" step="0.01">
    <label for="a-nota">Nota (opcional)</label>
    <input id="a-nota" type="text" maxlength="60" placeholder="Ej.: almuerzo">
    <div id="a-err" class="err"></div>
    <button id="a-save" class="p">Guardar</button>
    <button id="a-cancel" class="s">Cancelar</button>
  </div>
</section>

</main>
<script>
const $ = s => document.querySelector(s);
const KEY = 'ahorraplus.v2';
let S = load();

function load(){
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return { cfg: null, gastos: [], lastNotif: '', sinGasto: '' };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const money = n => 'S/ ' + n.toFixed(2);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function show(id){
  ['v-cfg','v-home','v-add'].forEach(v => $('#' + v).classList.toggle('hide', v !== id));
  window.scrollTo(0, 0);
}

/* Cálculo según la sección 11.1 del documento */
function calc(){
  const d = new Date(), hoy = iso(d), mes = hoy.slice(0, 7), c = S.cfg;
  const libre = c.ingreso - c.fijos - c.meta;
  const mg = S.gastos.filter(g => g.fecha.startsWith(mes));
  const antes = mg.filter(g => g.fecha < hoy).reduce((a, g) => a + g.monto, 0);
  const hoyG = mg.filter(g => g.fecha === hoy);
  const gh = hoyG.reduce((a, g) => a + g.monto, 0);
  const dias = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate() + 1;
  const diario = (libre - antes) / dias;
  return { libre, antes, gh, hoyG, dias, diario, disp: diario - gh, gastadoMes: antes + gh, hoy };
}

/* Recordatorio diario */
function pendiente(){
  const c = S.cfg;
  if (!c || !c.remOn) return false;
  const d = new Date(), hoy = iso(d);
  if (pad(d.getHours()) + ':' + pad(d.getMinutes()) < c.remTime) return false;
  if (S.sinGasto === hoy) return false;
  return !S.gastos.some(g => g.fecha === hoy);
}
function tick(){
  if (!S.cfg) return;
  const hoy = iso(new Date());
  if (pendiente() && S.lastNotif !== hoy && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Ahorra+', { body: 'Todavía no registraste gastos hoy. Anótalos en segundos.' }); } catch (e) {}
    S.lastNotif = hoy; save();
  }
  if (!$('#v-home').classList.contains('hide')) renderHome();
}

function renderHome(){
  const r = calc();
  const el = $('#h-disp');
  let cls = 'ok', msg = 'Vas bien. Puedes gastar hasta este monto hoy.';
  if (r.diario <= 0 || r.disp <= 0) { cls = 'bad'; msg = 'Ya pasaste el límite de hoy. La diferencia se reparte y mañana baja un poco.'; }
  else if (r.disp / r.diario < 0.3) { cls = 'warn'; msg = 'Cuidado: te queda poco por gastar hoy.'; }
  el.textContent = money(r.disp);
  el.className = 'big ' + cls;
  const bar = $('#h-bar');
  bar.className = 'bar ' + cls;
  bar.firstElementChild.style.width = (r.diario > 0 ? Math.min(100, Math.max(0, r.gh / r.diario * 100)) : 100) + '%';
  $('#h-msg').textContent = msg;

  const ban = $('#h-banner');
  if (pendiente()) { ban.textContent = 'Recordatorio: todavía no registraste gastos hoy. Si no gastaste nada, toca “Hoy no gasté nada”.'; ban.classList.remove('hide'); }
  else ban.classList.add('hide');

  $('#h-list').innerHTML = r.hoyG.length
    ? r.hoyG.slice().reverse().map(g => '<div class="row"><span>' + esc(g.nota || 'Gasto') + '</span><span>' + money(g.monto) + ' <button class="l" data-del="' + g.id + '" aria-label="Borrar gasto">Borrar</button></span></div>').join('')
    : '<p class="mut">Todavía no registraste gastos hoy.</p>';

  const usado = r.libre > 0 ? Math.min(100, Math.max(0, r.gastadoMes / r.libre * 100)) : 100;
  $('#h-mbar').style.width = usado + '%';
  $('#h-mes').textContent = 'Gastado en el mes: ' + money(r.gastadoMes) + ' de ' + money(Math.max(r.libre, 0)) + ' libres. Presupuesto diario: ' + money(Math.max(r.diario, 0)) + ' (quedan ' + r.dias + ' días contando hoy).';
}

function goHome(){ show('v-home'); renderHome(); }

function goCfg(){
  const c = S.cfg;
  $('#c-ing').value = c ? c.ingreso : '';
  $('#c-fij').value = c ? c.fijos : '';
  $('#c-met').value = c ? c.meta : '';
  $('#c-rem').checked = c ? c.remOn : false;
  $('#c-hora').value = c ? c.remTime : '20:00';
  $('#c-err').textContent = '';
  $('#c-cancel').classList.toggle('hide', !c);
  $('#c-reset').classList.toggle('hide', !c);
  show('v-cfg');
}

$('#c-save').onclick = () => {
  const ing = parseFloat($('#c-ing').value), fij = parseFloat($('#c-fij').value) || 0, met = parseFloat($('#c-met').value) || 0;
  const err = $('#c-err');
  if (!(ing > 0)) { err.textContent = 'Escribe cuánto ganas en el mes.'; return; }
  if (fij < 0 || met < 0) { err.textContent = 'Los montos no pueden ser negativos.'; return; }
  if (ing - fij - met <= 0) { err.textContent = 'Tus gastos fijos y tu meta de ahorro igualan o superan tu ingreso. Ajusta los montos.'; return; }
  const remOn = $('#c-rem').checked;
  S.cfg = { ingreso: ing, fijos: fij, meta: met, remOn, remTime: $('#c-hora').value || '20:00' };
  save();
  if (remOn && 'Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch (e) {} }
  goHome();
};
$('#c-cancel').onclick = goHome;
$('#c-reset').onclick = () => {
  if (confirm('¿Borrar todos tus datos de Ahorra+? Esto no se puede deshacer.')) {
    S = { cfg: null, gastos: [], lastNotif: '', sinGasto: '' }; save(); goCfg();
  }
};
$('#h-cfg').onclick = goCfg;
$('#h-add').onclick = () => { $('#a-monto').value = ''; $('#a-nota').value = ''; $('#a-err').textContent = ''; show('v-add'); $('#a-monto').focus(); };
$('#h-nada').onclick = () => { S.sinGasto = iso(new Date()); save(); renderHome(); };
$('#a-cancel').onclick = goHome;
$('#a-save').onclick = () => {
  const m = parseFloat($('#a-monto').value);
  if (!(m > 0)) { $('#a-err').textContent = 'Escribe un monto mayor a 0.'; return; }
  S.gastos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), fecha: iso(new Date()), monto: Math.round(m * 100) / 100, nota: $('#a-nota').value.trim() });
  save(); goHome();
};
['a-monto', 'a-nota'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#a-save').click(); }));
$('#h-list').onclick = e => {
  const id = e.target.getAttribute && e.target.getAttribute('data-del');
  if (id) { S.gastos = S.gastos.filter(g => g.id !== id); save(); renderHome(); }
};

document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
setInterval(tick, 30000);

if (S.cfg) goHome(); else goCfg();
</script>
</body>
</html>
